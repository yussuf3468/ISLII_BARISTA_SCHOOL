<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Colour the browser chrome to match the hero. Small detail, large effect
         on mobile where the address bar sits directly against the page. -->
    <meta name="theme-color" content="#120d0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfaf5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fallback title/description. <Seo> overrides these per route the moment
         React mounts; these exist for crawlers that don't execute JS and for
         the brief window before hydration. -->
    <title>ISLII Barista School — Become a World-Class Barista | Nairobi, Kenya</title>
    <meta
      name="description"
      content="Kenya's premier professional barista academy. Master espresso, latte art, brewing, bubble tea and café operations with hands-on training built to international standards."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open the TCP + TLS handshake to the image CDN before the parser
         reaches the requests that need it. Fonts are same-origin now, so no
         font preconnect is required. -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Fonts are self-hosted (see src/styles/fonts.css). Preloading the two
         latin files means they are in flight alongside the CSS rather than
         being discovered after it parses — which is what removes the flash of
         fallback text, and with it the reflow that flash causes.
         Only the `latin` subsets are preloaded; latin-ext loads on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fraunces-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-sans-latin.woff2"
      crossorigin
    />

    <!-- LCP candidate: the hero photograph. Fetched in parallel with the JS
         bundle rather than after it, which is worth roughly 0.4s on hero paint.

         These URLs must match what <Photo name="latteArtPour"> generates
         BYTE FOR BYTE (same params, same order, same width ladder) — a preload
         that differs by even one character is not a head start, it's a second
         download of the same image. Cross-check against `photoSrc()` in
         src/lib/images.ts if either side changes. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=1920&h=1080"
      imagesrcset="
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=480&h=270 480w,
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=768&h=432 768w,
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=1024&h=576 1024w,
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=1440&h=810 1440w,
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=1920&h=1080 1920w,
        https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=72&w=2560&h=1440 2560w"
      imagesizes="100vw"
    />
  </head>

  <body>
    <!-- Paint the hero's colour immediately so first paint is espresso-dark
         rather than white. Removed from the flow the instant React mounts. -->
    <!-- `100vh` first, then `100dvh` for browsers that understand it. An
         older engine drops the second declaration and keeps the first;
         with only `dvh` it would drop both and the panel would collapse. -->
    <div id="root" style="background-color: #120d0a; min-height: 100vh; min-height: 100dvh"></div>

    <noscript>
      <div style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>ISLII Barista School</h1>
        <p>
          Kenya's premier professional barista academy — Nairobi. Training in espresso, latte art,
          brewing, bubble tea, milkshakes and café operations.
        </p>
        <p>
          This site needs JavaScript enabled. To enrol right now, call
          <a href="tel:+254746487878">+254&nbsp;746&nbsp;487878</a> or message us on
          <a href="https://wa.me/254746487878">WhatsApp</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════════════════════════
         BOOT FALLBACK
         ───────────────────────────────────────────────────────────────────
         Without this, a browser that cannot run the app shows the espresso
         `#root` rectangle and nothing else, for ever. No spinner, no message,
         no way to tell "loading" from "broken" — which is what an old phone or
         laptop was getting.

         Three ways it can fail, all handled here:

           1. NO ES MODULE SUPPORT — `<script type="module">` is silently
              ignored, so nothing runs and no error is raised. The `nomodule`
              script below only executes in exactly those browsers.
           2. A RUNTIME ERROR while booting.
           3. ANYTHING ELSE — a chunk that never arrives on a bad connection,
              a CSS feature the browser refuses. The watchdog catches these
              because it checks for the ONE thing that actually matters: did
              React put anything on the page.

         Deliberately dependency-free: inline styles and system fonts, because
         the stylesheet is one of the things that may not have loaded. And it
         leads with the phone number — a visitor on a device too old for the
         site is still someone who wants to enrol, and a phone call is a far
         better outcome than a black screen.
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var shown = false;

        function showFallback(reason) {
          if (shown) return;
          shown = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.style.background = '#120d0a';
          root.style.minHeight = '100vh';
          root.innerHTML =
            '<div style="max-width:34rem;margin:0 auto;padding:3.5rem 1.5rem;' +
            'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;' +
            'color:#f0e8d8;text-align:center;line-height:1.6">' +
            '<h1 style="font-size:1.5rem;margin:0 0 .5rem;letter-spacing:.02em">ISLII BARISTA SCHOOL</h1>' +
            '<p style="margin:0 0 2rem;color:#c8a15a;font-size:.8125rem;letter-spacing:.18em;text-transform:uppercase">Nairobi, Kenya</p>' +
            '<p style="margin:0 0 1.5rem;color:rgba(240,232,216,.75)">' +
            'This site needs a more recent browser than the one you are using. ' +
            'Updating your browser will load it &mdash; or just get in touch, we are happy to help directly.' +
            '</p>' +
            '<p style="margin:0 0 .75rem">' +
            '<a href="tel:+254746487878" style="display:inline-block;background:#c8a15a;color:#120d0a;' +
            'padding:.85rem 1.75rem;border-radius:2rem;text-decoration:none;font-weight:600">' +
            'Call +254&nbsp;746&nbsp;487878</a></p>' +
            '<p style="margin:0 0 2rem">' +
            '<a href="https://wa.me/254746487878" style="color:#d9b878;text-decoration:underline;' +
            'text-underline-offset:4px">Message us on WhatsApp</a></p>' +
            '<p style="margin:0;font-size:.875rem;color:rgba(240,232,216,.45)">' +
            'Major Muriithi Street, Eastleigh, Nairobi<br>Monday &ndash; Friday, 9am &ndash; 10pm</p>' +
            '</div>';

          if (window.console && console.warn) {
            console.warn('[islii] app did not start:', reason);
          }
        }

        // 1. No ES module support — this script tag is the only one such a
        //    browser will run.
        var probe = document.createElement('script');
        if (!('noModule' in probe)) {
          showFallback('no ES module support');
          return;
        }

        // 2. A hard error during boot.
        window.addEventListener('error', function (e) {
          if (document.getElementById('root').childElementCount === 0) {
            showFallback((e && e.message) || 'script error');
          }
        });

        // 3. Anything else. Ten seconds is generous on a slow Kenyan mobile
        //    connection but well short of the point where a visitor gives up
        //    and closes the tab.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showFallback('timed out waiting for the app to render');
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
